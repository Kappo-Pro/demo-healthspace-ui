version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: vitalflow-ui-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./craco.config.js:/app/craco.config.js
      # Prevent node_modules override
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:1337}
    command: npm start
    networks:
      - vitalflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Storybook service for component development
  storybook:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vitalflow-storybook
    ports:
      - "6006:6006"
    volumes:
      - ./src:/app/src
      - ./.storybook:/app/.storybook
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run storybook
    networks:
      - vitalflow-network
    restart: unless-stopped

  # E2E testing service
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: vitalflow-e2e
    depends_on:
      - app
    volumes:
      - ./e2e:/app/e2e
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - /app/node_modules
    environment:
      - TEST_ENV=local
      - BASE_URL=http://app:3000
    command: npx playwright test
    networks:
      - vitalflow-network
    profiles:
      - testing

  # Optional: Nginx reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    container_name: vitalflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./build:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - vitalflow-network
    profiles:
      - production

networks:
  vitalflow-network:
    driver: bridge
    name: vitalflow-network

volumes:
  node_modules:
    name: vitalflow-node-modules
