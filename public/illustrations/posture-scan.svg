<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#F0F7FF" opacity="0.5"/>

  <!-- Camera -->
  <rect x="110" y="50" width="80" height="60" rx="8" fill="#4F46E5"/>
  <circle cx="150" cy="80" r="15" fill="#818CF8"/>
  <circle cx="150" cy="80" r="8" fill="#C7D2FE"/>

  <!-- Person silhouette -->
  <circle cx="150" cy="160" r="20" fill="#6366F1"/>
  <ellipse cx="150" cy="210" rx="25" ry="40" fill="#6366F1"/>
  <line x1="125" y1="190" x2="115" y2="220" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="190" x2="185" y2="220" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="250" x2="130" y2="280" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="250" x2="170" y2="280" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>

  <!-- Scan lines -->
  <line x1="90" y1="150" x2="210" y2="150" stroke="#818CF8" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="90" y1="180" x2="210" y2="180" stroke="#818CF8" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="90" y1="210" x2="210" y2="210" stroke="#818CF8" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Focus frame -->
  <rect x="100" y="130" width="100" height="150" rx="4" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="10,5"/>
</svg>
