<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#D1FAE5" opacity="0.5"/>

  <!-- Person stretching -->
  <circle cx="130" cy="110" r="18" fill="#10B981"/>

  <!-- Body -->
  <ellipse cx="130" cy="155" rx="22" ry="35" fill="#10B981"/>

  <!-- Arms (stretching) -->
  <line x1="108" y1="140" x2="70" y2="130" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  <line x1="152" y1="140" x2="190" y2="120" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="120" y1="190" x2="110" y2="230" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="190" x2="150" y1="230" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>

  <!-- Motion lines -->
  <path d="M 50 125 Q 45 125 40 125" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 45 135 Q 40 135 35 135" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 210 115 Q 215 115 220 115" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 215 125 Q 220 125 225 125" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Mat -->
  <ellipse cx="130" cy="240" rx="70" ry="15" fill="#059669" opacity="0.3"/>

  <!-- Checkmarks (completed exercises) -->
  <circle cx="200" cy="200" r="20" fill="#059669"/>
  <path d="M 192 200 L 197 205 L 208 194" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="220" cy="160" r="18" fill="#059669"/>
  <path d="M 213 160 L 217 164 L 227 154" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
